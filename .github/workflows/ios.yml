name: iOS ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Иконка приложения
        run: |
          D=Assets.xcassets/AppIcon.appiconset
          mkdir -p "$D" Icons
          SRC=$(ls icon.* | head -1)
          sips -z 1024 1024 -s format png "$SRC" --out "$D/icon.png"
          sips -z 120 120 -s format png "$SRC" --out "Icons/UchyobaIcon60x60@2x.png"
          sips -z 180 180 -s format png "$SRC" --out "Icons/UchyobaIcon60x60@3x.png"
          printf '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          printf '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$D/Contents.json"

      - name: Генерация проекта
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка без подписи
        run: |
          xcodebuild -project Uchyoba.xcodeproj -target Uchyoba \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Иконки в приложение
        run: |
          APP=build/Release-iphoneos/Uchyoba.app
          ls -R Icons Assets.xcassets
          cp Icons/UchyobaIcon60x60@2x.png Icons/UchyobaIcon60x60@3x.png "$APP/"
          ls "$APP"

      - name: Упаковка в ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Uchyoba.app out/Payload/
          cd out && zip -qry Uchyoba.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Uchyoba-ipa
          path: out/Uchyoba.ipa
