name: Uchyoba
options:
  bundleIdPrefix: ru.arman
  deploymentTarget:
    iOS: "15.0"
targets:
  Uchyoba:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: index.html
        buildPhase: resources
      - path: Assets.xcassets
      - path: Icons
        buildPhase: resources
    dependencies:
      - target: UchyobaWidget
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Учёба
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "1"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - UchyobaIcon20x20
              - UchyobaIcon29x29
              - UchyobaIcon40x40
              - UchyobaIcon60x60
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Чтобы прикреплять фото конспектов.
        NSCameraUsageDescription: Чтобы фотографировать конспекты.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arman.uchyoba
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  UchyobaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Учёба
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arman.uchyoba.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
